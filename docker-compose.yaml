services:
  grpc-client:
    build:
      dockerfile: ./GrpcClient/Dockerfile
    image: grpcclient-img
    stdin_open: true
    tty: true
    environment:
      - master-node=http://master-service:5003
      - secondary1-node=http://secondary1-service:5001
      - secondary2-node=http://secondary2-service:5002
    depends_on:
      - master-service
      - secondary1-service
      - secondary2-service
    networks:
      - grpc-network
  
  master-service:
    build:
      dockerfile: ./MessageService/Dockerfile
    image: message-service-img
    environment:
      - ASPNETCORE_ENVIRONMENT=Master
      - ASPNETCORE_URLS=http://+:5003
      - ASPNETCORE_HTTP_PORTS=5003
    command: ["--configFile=/app/appsettings.Master.json"]
    volumes:
      - ./MessageService/appsettings.Master.json:/app/appsettings.Master.json
    ports:
      - "5003:5003"
    networks:
      - grpc-network

  secondary1-service:
    build:
      dockerfile: ./MessageService/Dockerfile
    image: message-service-img
    environment:
      - ASPNETCORE_ENVIRONMENT=Secondary1
      - ASPNETCORE_URLS=http://+:5001
    command: ["--configFile=/app/appsettings.Secondary1.json"]
    volumes:
      - ./MessageService/appsettings.Secondary1.json:/app/appsettings.Secondary1.json
    ports:
      - "5001:5001"
    networks:
      - grpc-network

  secondary2-service:
    build:
      dockerfile: ./MessageService/Dockerfile
    image: message-service-img
    environment:
      - ASPNETCORE_ENVIRONMENT=Secondary2
      - ASPNETCORE_URLS=http://+:5002
    command: ["--configFile=/app/appsettings.Secondary2.json"]
    volumes:
      - ./MessageService/appsettings.Secondary2.json:/app/appsettings.Secondary2.json
    ports:
      - "5002:5002"
    networks:
      - grpc-network
    
networks:
  grpc-network:
    driver: bridge
