syntax = "proto3";

option csharp_namespace = "GrpcServices";

service MessageService {
  rpc GetMessages (Empty) returns (MessageList);
  
  rpc AddMessage (MessageRequest) returns (MessageResponse);
}

message Empty {}

message MessageRequest {
  string message = 1;
  int32 writeConcern = 2;
}

message MessageResponse {
  string message = 1;
}

message MessageList {
  repeated MessageResponse items = 1;
}